name: Cosmetic Control 4.0 Android 16 debug APK
on:
  push:
    branches: [cosmetic-control-4-android16-build]
    paths-ignore:
      - 'download/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract original Cosmetic Control 4.0 source
        run: |
          tar -xJf cc4-android16-src.tar.xz
          sed -i 's/PreviewEffect\.AURA/PreviewEffect.ARMOR_AURA/g' app/src/test/java/studio/cosmeticlab/DemoModeTest.kt
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK setup (current action)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android 16 SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Source security checks
        run: python3 tools/security_scan.py
      - name: Android APK build and unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: APK SHA256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app-debug.sha256
      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Cosmetic-Control-4.0-Android16-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.sha256
          if-no-files-found: error
      - name: Publish APK for browser download
        run: |
          mkdir -p download
          cp app/build/outputs/apk/debug/app-debug.apk download/Cosmetic-Control-4.0-Android16.apk
          sha256sum download/Cosmetic-Control-4.0-Android16.apk > download/Cosmetic-Control-4.0-Android16.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f download/Cosmetic-Control-4.0-Android16.apk
          git add download/Cosmetic-Control-4.0-Android16.sha256
          if ! git diff --cached --quiet; then
            git commit -m "Publish Cosmetic Control 4.0 APK [skip ci]"
            git push
          fi
